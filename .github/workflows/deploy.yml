name: CI/CD Smart Deploy (Backend / Web)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_backend:
        description: "Force deploy backend"
        type: boolean
        default: false
      force_web:
        description: "Force deploy web"
        type: boolean
        default: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.result.outputs.backend }}
      web: ${{ steps.result.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: changes
        if: github.event_name == 'push'
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi

          if echo "$CHANGED" | grep -q "^backend/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -q "^web/"; then
            echo "web=true" >> $GITHUB_OUTPUT
          fi

      - name: Compute final result
        id: result
        run: |
          BACKEND="${{ steps.changes.outputs.backend }}"
          WEB="${{ steps.changes.outputs.web }}"

          if [ "${{ github.event.inputs.force_backend }}" == "true" ]; then
            BACKEND="true"
          fi
          if [ "${{ github.event.inputs.force_web }}" == "true" ]; then
            WEB="true"
          fi

          echo "backend=${BACKEND}" >> $GITHUB_OUTPUT
          echo "web=${WEB}" >> $GITHUB_OUTPUT

  deploy-backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/"
          target: "~/messenger_IVAN"

      - name: Restart Backend Containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/messenger_IVAN/backend
            docker compose up -d --build
            docker image prune -f

  deploy-web:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Web to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "web/"
          target: "~/messenger_IVAN"

      - name: Restart Web Container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/messenger_IVAN/web
            docker compose up -d --build messenger-web
            docker image prune -f