# Grafana + InfluxDB для визуализации результатов k6
#
# Запуск:
#   docker compose -f docker-compose.grafana.yml up -d
#
# После:
#   1. Открой http://localhost:3000 (admin/admin)
#   2. Добавь datasource: InfluxDB, URL http://influxdb:8086, Database k6
#   3. Импортируй дашборд: https://grafana.com/grafana/dashboards/10660
#
# Запуск теста:
#   k6 run --env BASE_URL=http://localhost:8081 --out influxdb=http://localhost:8086/k6 stress.js

services:
  influxdb:
    image: influxdb:1.8
    container_name: k6-influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: admin
      # Оптимизация для высокой нагрузки
      INFLUXDB_HTTP_MAX_BODY_SIZE: 0
      INFLUXDB_HTTP_MAX_CONNECTION_LIMIT: 0
      INFLUXDB_DATA_MAX_VALUES_PER_TAG: 0
      INFLUXDB_DATA_MAX_SERIES_PER_DATABASE: 0
    volumes:
      - influxdb_data:/var/lib/influxdb
    # Увеличиваем ресурсы для InfluxDB
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  grafana:
    image: grafana/grafana:latest
    container_name: k6-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb

volumes:
  influxdb_data:
  grafana_data:
